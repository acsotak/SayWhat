<html>
<head>
    <title>SayWhat?</title>
    <link rel="icon" type="image/png" href="images/2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div id="headerBanner">
            <img src="images/1.png" alt="SayWhat? logo" id="logo">
            <div id="headerSub">Words are weird. <b>Let's talk.</b></div>
        </div>
    </header>
    <div id="textEntry">
        <div id="bio">
            <p>Words can be tricky, especially when they don't quite mean what they say.<br>Drop a phrase below, and let's get to the bottom of it <b>together</b>.</p>
        </div>
        <form id="textForm">
            <div id="textBox">
                <input type="text" id="promptStart" class="mainTextBox" placeholder="Wait...what does this mean?" autocomplete="off" required/>
                <button type="submit" class="submitButton"><b>→</b></button>
            </div>
        </form>
    </div>
    <section id="inputResponseScreen">
        <div id="responseHeader">
            <img src="images/3.png" alt="SayWhat?" id="responseLogo">
        </div>
        <div id="enteredPhrase">
            <span id="responseLabel">INVESTIGATING</span>
            <h2 id="inputHeading"></h2>
        </div>
        <div id="resultsWrap">
            <div id="thinkingTransitionScreen">
                <p>Doing some detective work. Hold tight!</p>
                <div id="thinkingDots">
                    <span class="one"></span>
                    <span class="two"></span>
                    <span class="three"></span>
                </div>
            </div>
            <div id="resultsHeader">
                <h3>Check out what we came up with:</h3>
                <p id="resultText">
                    EXPLANATION
                </p>
            </div>

        </div>

    </section>
    <script src="script.js"></script>
</body>
</html>
