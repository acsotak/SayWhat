<head>
    <title>SayWhat?</title>
    <link rel="icon" type="image/png" href="2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="headerBanner">
            <img src="1.png" alt="SayWhat? logo" id="logo">
            <div id="headerSub">Words are weird. <b>Let's talk.</b></div>
        </div>
    </header>
    <div id="textEntry">
        <div id="bio">
            <p>Words can be tricky, especially when they don't mean quite what they say.<br>Drop a phrase below, and let's get to the bottom of it <b>together</b>.</p>
        </div>
        <div id="textBox">
            <input type="text" id="promptStart" class="mainTextBox" placeholder="Wait...what does this mean?"/>
            <button type="submit" class="submitButton"><b>→</b></button>
        </div>
    </div>

</body>
